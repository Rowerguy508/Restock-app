    // Render Signup Page
    function renderSignup() {
        document.getElementById('page-title').textContent = 'Get Started - Restocka';
        document.getElementById('dynamic-styles').textContent = signupStyles;
        document.getElementById('page-body').innerHTML = \`
            <header><div class="container"><a href="https://landing.restocka.app" class="logo">Restock<span>a</span></a></div></header>
            <main class="container">
                <div class="progress">
                    <div class="step active" id="step1">1</div><div class="step-line" id="line1"></div>
                    <div class="step" id="step2">2</div><div class="step-line" id="line2"></div>
                    <div class="step" id="step3">3</div>
                </div>
                <div class="card">
                    <div id="step1-form">
                        <h1>Create Your Account</h1>
                        <p class="subtitle">Start your 7-day free trial. No credit card required.</p>
                        <form id="signup-form" onsubmit="handleSignup(event)">
                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" id="email" placeholder="you@restaurant.com" required>
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" id="password" placeholder="Create a strong password" minlength="8" required>
                                <p class="hint">At least 8 characters</p>
                            </div>
                            <div class="input-group">
                                <label>Restaurant Name</label>
                                <input type="text" id="restaurantName" placeholder="e.g., La Cocina Restaurant" required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="submit-btn">Continue to Step 2 →</button>
                        </form>
                        <div class="benefits">
                            <div class="benefit"><div class="benefit-icon">✓</div><span class="benefit-text">7-day free trial of Pro features</span></div>
                            <div class="benefit"><div class="benefit-icon">✓</div><span class="benefit-text">No credit card required</span></div>
                            <div class="benefit"><div class="benefit-icon">✓</div><span class="benefit-text">Cancel anytime</span></div>
                        </div>
                    </div>
                    <div id="step2-form" style="display:none;">
                        <h1>Add Your Location</h1>
                        <p class="subtitle">Tell us about your first restaurant location.</p>
                        <form onsubmit="handleStep2(event)">
                            <div class="input-group">
                                <label>Location Name</label>
                                <input type="text" id="locationName" placeholder="e.g., Main Branch" required>
                            </div>
                            <div class="input-group">
                                <label>Address (Optional)</label>
                                <input type="text" id="locationAddress" placeholder="e.g., 123 Main St">
                            </div>
                            <button type="submit" class="btn btn-primary">Continue to Step 3 →</button>
                            <button type="button" class="btn btn-secondary" onclick="goBack(1)">← Back</button>
                        </form>
                    </div>
                    <div id="step3-form" style="display:none;">
                        <h1>You're All Set!</h1>
                        <p class="subtitle">Your restaurant is ready. Start tracking inventory today.</p>
                        <div style="text-align:center;padding:20px 0;">
                            <div style="font-size:48px;margin-bottom:16px;">🎉</div>
                            <p style="color:#0d9488;font-weight:600;margin-bottom:8px;">7-Day Free Trial Activated!</p>
                            <p style="color:#64748b;font-size:14px;">Pro features are now enabled.</p>
                        </div>
                        <a href="https://app.restocka.app" class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;">Open Restocka App →</a>
                        <button onclick="window.location.href='https://app.restocka.app'" class="btn btn-secondary">Explore Dashboard</button>
                        <div style="margin-top:24px;padding:16px;background:#f0fdfa;border-radius:12px;">
                            <p style="font-size:14px;color:#0f766e;font-weight:500;">💡 Quick Tip</p>
                            <p style="font-size:13px;color:#64748b;margin-top:4px;">Add your products first, then set up reorder rules for automated ordering.</p>
                        </div>
                    </div>
                </div>
            </main>
            <footer>
                <p>© 2026 Restocka. All rights reserved.</p>
            </footer>
            <script>
                let currentStep = 1;
                function updateProgress() {
                    for (let i=1;i<=3;i++) {
                        const step=document.getElementById('step'+i);
                        step.classList.remove('active','completed');
                        if(i<currentStep) step.classList.add('completed');
                        if(i===currentStep) step.classList.add('active');
                    }
                    for(let i=1;i<3;i++) {
                        const line=document.getElementById('line'+i);
                        line.classList.remove('active');
                        if(i<currentStep) line.classList.add('active');
                    }
                }
                function showStep(step) {
                    document.getElementById('step1-form').style.display=step===1?'block':'none';
                    document.getElementById('step2-form').style.display=step===2?'block':'none';
                    document.getElementById('step3-form').style.display=step===3?'block':'none';
                    currentStep=step;updateProgress();
                }
                function goBack(step){showStep(step);}
                async function handleSignup(e){
                    e.preventDefault();
                    const btn=document.getElementById('submit-btn');
                    btn.disabled=true;btn.textContent='Creating Account...';
                    await new Promise(r=>setTimeout(r,1000));
                    localStorage.setItem('restocka_user',JSON.stringify({email:document.getElementById('email').value,restaurantName:document.getElementById('restaurantName').value}));
                    btn.disabled=false;btn.textContent='Continue to Step 2 →';showStep(2);
                }
                function handleStep2(e){
                    e.preventDefault();
                    const data=JSON.parse(localStorage.getItem('restocka_user')||'{}');
                    data.locationName=document.getElementById('locationName').value;
                    data.locationAddress=document.getElementById('locationAddress').value;
                    localStorage.setItem('restocka_user',JSON.stringify(data));
                    showStep(3);
                }
            <\/script>
        \`;
    }

    }
    
    // Render App Placeholder
    function renderApp() {
        document.getElementById('page-title').textContent = 'Restocka App';
        document.getElementById('dynamic-styles').textContent = appStyles;
        document.getElementById('page-body').innerHTML = \`
            <div class="app-container">
                <div class="app-header">
                    <h1 class="app-title">Restocka</h1>
                    <p class="app-subtitle">Restaurant Inventory Management</p>
                </div>
                <div class="login-prompt">
                    <h2>Sign in to continue</h2>
                    <p>Access your inventory dashboard, orders, and analytics.</p>
                    <a href="https://login.restocka.app" class="btn btn-primary">Sign In</a>
                    <p style="margin-top:16px;color:#64748b;font-size:14px;">New here? <a href="https://signup.restocka.app" style="color:#0d9488;">Create free account</a></p>
                </div>
            </div>
        \`;
    }
    
    // Router
    if (isSignup) {
        renderSignup();
    } else if (isApp && hostname.includes('login')) {
        renderLogin();
    } else if (isApp) {
        renderApp();
    } else {
        renderLanding();
    }
    </script>
</body>
</html>
