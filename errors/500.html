<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error - Poniente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #7f1d1d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 100px; font-weight: 700; margin-bottom: 10px; }
        h2 { font-size: 28px; margin-bottom: 20px; }
        p { color: #fecaca; margin-bottom: 30px; font-size: 16px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: white;
            color: #991b1b;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            margin: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .error-icon { font-size: 60px; margin-bottom: 20px; }
        .retry-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            font-size: 14px;
        }
        .retry-info code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <h1>500</h1>
        <h2>Something Went Wrong</h2>
        <p>We encountered an unexpected error. Our team has been notified.</p>
        <div>
            <a href="/" class="btn">Go Home</a>
            <a href="javascript:location.reload()" class="btn">Retry</a>
        </div>
        <div class="retry-info">
            <p>Error ID: <code>$(date +%s)-xxxx</code></p>
            <p>Timestamp: <code>$(date)</code></p>
        </div>
    </div>
    <script>
        document.querySelector('code').textContent = 
            Math.random().toString(36).substring(2, 10).toUpperCase();
        document.querySelectorAll('code')[1].textContent = new Date().toISOString();
    </script>
</body>
</html>
