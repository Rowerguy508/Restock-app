<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found - Poniente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 120px; font-weight: 700; color: #0d9488; margin-bottom: 10px; }
        h2 { font-size: 32px; margin-bottom: 20px; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: #0d9488;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: #0f766e; transform: translateY(-2px); }
        .error-icon { font-size: 60px; margin-bottom: 20px; }
        .search { margin-top: 30px; }
        .search input {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            width: 300px;
            font-size: 16px;
        }
        .search input:focus { outline: none; border-color: #0d9488; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">🔍</div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Go to Homepage</a>
        <div class="search">
            <input type="text" placeholder="Search Poniente...">
        </div>
    </div>
</body>
</html>
